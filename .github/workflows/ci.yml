name: CI

# The repo is public, so Actions minutes are free. scripts/check.sh is still
# run locally by the pre-push hook for fast feedback; CI runs the same script
# on every push and pull request, skips docs-only changes, and can be started
# by hand from the Actions tab.
on:
  push:
    paths-ignore: ["**.md", "docs/**", ".claude/**", "data/probe/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".claude/**", "data/probe/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: scripts/check.sh
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19 (actions/runner-images#14748).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "lupa>=2.0"
      - run: sudo apt-get install -y -q luarocks && sudo luarocks install luacheck
      - run: BATTLEPLAN_REQUIRE_LUACHECK=1 sh scripts/check.sh
