name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lunarmodules/luacheck@v1

  tests:
    name: smoke, perf, tools and rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "lupa>=2.0"
      - run: python tests/smoke_test.py
      - run: python tests/perf_test.py
      - run: python tests/test_tools.py
      - run: python tests/test_rules.py
